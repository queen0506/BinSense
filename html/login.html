<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinSense - Login/Register</title>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;700&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="mobile-container">

        <header class="branding">
            <div class="logo-wrapper">
                <img src="../logo/Logo1.png" alt="BinSense Logo" class="logo">
            </div>
        </header>

        <main class="content-card">

            <!-- LOGIN SECTION -->
            <section id="login-section">
                <h2 class="title">Welcome Back!</h2>
                <p class="subtitle">Login to your account</p>

                <form class="auth-form" id="login-form">
                    <input type="email" id="loginEmail" placeholder="Email" required>

                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <button type="button" class="password-toggle" data-target="loginPassword"></button>
                    </div>

                    <div id="login-error" class="error-text"></div>

                    <div class="forgot-link">
                        <a href="#" onclick="showForgot()">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">LOGIN</button>
                </form>

                <p class="toggle-text">
                    Don't have an account? <span class="link" onclick="showRegister()">Sign Up</span>
                </p>
            </section>


            <!-- FORGOT PASSWORD -->
            <section id="forgot-section" style="display: none;">
                <h2 class="title">Reset Password</h2>
                <p class="subtitle">Enter your email and we will send reset instructions.</p>

                <form id="forgot-form" class="auth-form">
                    <input type="email" placeholder="Email" required>
                    <button type="submit" class="btn-primary">SEND RESET LINK</button>
                </form>

                <p class="toggle-text">
                    Remember your password? <span class="link" onclick="showLogin()">Login</span>
                </p>
            </section>


            <!-- REGISTER SECTION -->
            <section id="register-section" style="display:none;">
                <h2 class="title">Register</h2>
                <p class="subtitle">Create your new account</p>

                <form id="register-form" class="auth-form" novalidate>

                    <input type="text" id="registerName" placeholder="Full name" required>
                    <input type="email" id="registerEmail" placeholder="Email" required>

                    <div class="password-wrapper">
                        <input type="password" id="registerPassword" placeholder="Password" required>
                        <button type="button" class="password-toggle" data-target="registerPassword"></button>
                    </div>

                    <div class="password-wrapper">
                        <input type="password" id="registerConfirm" placeholder="Confirm Password" required>
                        <button type="button" class="password-toggle" data-target="registerConfirm"></button>
                    </div>

                    <p id="register-message" class="error-text" role="alert" aria-live="polite"></p>
                    <button id="register-submit" type="submit" class="btn-primary">SIGN UP</button>
                </form>

                <p class="toggle-text">
                    Already have an account? <span class="link" onclick="showLogin()">Login</span>
                </p>
            </section>

        </main>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
