<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinSense - Real-Time Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/system admin/system-logs.css">
</head>
<body>

<div class="mobile-container">
    <header class="top-nav">
        <h1 class="dashboard-title">System Logs</h1>
    </header>

    <div class="logs-toolbar">
        <div class="log-filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="logs">Logs</button>
            <button class="filter-tab" data-filter="audit">Audit</button>
        </div>
        <div class="logs-search-wrapper">
            <input type="text" id="logSearchInput" class="logs-search-input" placeholder="Search user, action...">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>

         <!-- BAGONG DROPDOWN PARA SA MOBILE SORTING -->
        <div class="mobile-sort-wrapper">
            <select id="mobileSortSelect" class="mobile-sort-select">
                <option value="timestamp-desc">Sort by: Newest First</option>
                <option value="timestamp-asc">Sort by: Oldest First</option>
                <option value="email-asc">Sort by: User (A-Z)</option>
                <option value="email-desc">Sort by: User (Z-A)</option>
                <option value="role-asc">Sort by: Role (A-Z)</option>
                <option value="category-asc">Sort by: Category (A-Z)</option>
                <option value="action-asc">Sort by: Action (A-Z)</option>
            </select>
        </div>
    </div>

    <div class="logs-table-container">
        <table class="logs-table">
            <thead>
                <tr>
                    <th class="sortable" data-sort="timestamp">Time <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-sort="email">User <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-sort="role">Role <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-sort="category">Category <span class="sort-icon">↕</span></th>
                    <th class="sortable" data-sort="action">Action <span class="sort-icon">↕</span></th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="logs-display">
                <tr>
                    <td colspan="6" style="text-align: center; color: var(--lgu-muted); padding: 40px 0;">Synchronizing activities...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="logs-pagination">
        <button id="prevPageBtn" class="page-btn" disabled>Previous</button>
        <span id="pageInfo" class="page-info">Page 1 of 1</span>
        <button id="nextPageBtn" class="page-btn" disabled>Next</button>
    </div>

    <footer class="bottom-nav">
        <div class="nav-icons-container">
            <a href="system-management.html" class="nav-link"><img src="../../logo/Home.png" class="icon-30"></a>
            <a href="system-users.html" class="nav-link"><img src="../../logo/Bar chart-2.png" class="icon-30"></a>
            <a href="system-logs.html" class="nav-link active"><img src="../../logo/Activity History.png" class="icon-30"></a>
            <a href="system-menu.html" class="nav-link"><img src="../../logo/Menu.png" class="icon-30"></a>
        </div>
    </footer>
</div>

<script src="../../js/system admin/system-logs.js" type="module"></script>
</body>
</html>
