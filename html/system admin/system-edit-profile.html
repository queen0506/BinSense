<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinSense - Edit Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/system admin/system-edit-profile.css">
</head>
<body>

    <div class="mobile-container">
        
        <header class="top-nav">
            <div class="header-content">
                <span class="back-btn" id="back-btn">←</span>
                <h1 class="page-title">Edit Account Information</h1>
            </div>
        </header>

        <main class="main-content">
            <div class="graphic-section">
                <img src="../../logo/edit-image.png" alt="Edit Graphic" class="center-graphic">
            </div>
            <p id="current-user-name" class="current-user-name">Loading user...</p>

            <form class="edit-form">
                <div class="input-group">
                    <label for="fullName">Full Name*</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="input-group">
                    <label for="emailAddress">Email Address*</label>
                    <input type="email" id="emailAddress" name="emailAddress" required>
                </div>

                <button type="submit" class="btn-update">Update Information</button>
            </form>
        </main>

    </div>

    <script type="module" src="../../js/system admin/system-edit-profile.js"></script>
</body>
</html>
