<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinSense - Statistics</title>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/analytics.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="mobile-container">
        
        <header class="top-nav">
            <h1 class="dashboard-title">Statistics</h1>
            
            <div class="notification-icon-container">
                <button class="notification-btn" id="notificationBtn">
                    <svg class="notification-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

        </header>

        <main class="main-content">
            <!-- ADDED NOTIFICATION PANEL HERE -->
            <div id="notificationPanel" class="notification-panel">
                <div class="notification-panel-header">
                    <h3>Notifications</h3>
                    <button class="close-notification-btn" id="closeNotificationBtn">&times;</button>
                </div>
                <div id="notificationList" class="notification-list">
                    <p class="empty-notification-message">No new notifications</p>
                </div>
                <div class="notification-panel-footer">
                    <button class="clear-all-btn" id="clearAllBtn">Clear All</button>
                </div>
            </div>
            <!-- END OF NOTIFICATION PANEL -->

            <h2 class="section-title">Waste Overview</h2>
            
            <div class="chart-container">
                <canvas id="binChart"></canvas>
            </div>

            <div class="status-performance-card">
                <div class="status-text">
                    <h3>You're doing great!</h3>
                    <p>Today's average usage is 0%. Keep collecting responsibly!</p>
                </div>
            </div>
        </main>

        <footer class="bottom-nav">
            <div class="nav-icons-container">
                <a href="dashboard.html" class="nav-link"><img src="../logo/Home.png" alt="Home" class="icon-30"></a>
                <a href="#" class="nav-link active"><img src="../logo/Bar chart-2.png" alt="Analytics" class="icon-30"></a>
                <a href="history.html" class="nav-link"><img src="../logo/Activity History.png" alt="Reports" class="icon-30"></a>
                <a href="menu.html" class="nav-link"><img src="../logo/Menu.png" alt="Menu" class="icon-30"></a>
            </div>
        </footer>

    </div>

    <script type="module" src="../js/analytics.js"></script>
</body>
</html>
