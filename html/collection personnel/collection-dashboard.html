<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinSense - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/collection personnel/collection-dashboard.css">
</head>
<body>

<div class="mobile-container">
    <header class="top-nav">
        <h1 class="dashboard-title">Route Dashboard</h1>
    </header>

    <main class="content-area">
        <div id="map-container" class="full-screen-map">
            <div class="map-placeholder">
                <p>Initializing Route Map...</p>
                <span>Full bins will appear here as waypoints</span>
            </div>
        </div>
    </main>

    <footer class="bottom-nav">
        <div class="nav-icons-container">
            <a href="collection-dashboard.html" class="nav-link active">
                <img src="../../logo/Home.png" alt="Home" class="icon-30">
            </a>
            <a href="collection-update.html" class="nav-link ">
                <img src="../../logo/Bar chart-2.png" alt="Analytics" class="icon-30">
            </a>
            <a href="collection-schedule.html" class="nav-link">
                <img src="../../logo/Activity History.png" alt="Reports" class="icon-30">
            </a>
            <a href="collection-menu.html" class="nav-link">
                <img src="../../logo/Menu.png" alt="Menu" class="icon-30">
            </a>
        </div>
    </footer>
</div>

<!-- Confirmation Modal -->
<div id="confirmModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 400px; text-align: center; font-family: 'Reddit Sans', sans-serif;">
        <h3 style="color: #99cc33; margin-top: 0;">Confirm Collection</h3>
        <p style="color: #666; margin-bottom: 25px;">Is this bin already collected? This will update the route for all personnel.</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="cancelCollect" style="flex: 1; padding: 12px; border: none; border-radius: 8px; background: #eee; color: #666; font-weight: bold; cursor: pointer;">Cancel</button>
            <button id="confirmCollect" style="flex: 1; padding: 12px; border: none; border-radius: 8px; background: #99cc33; color: white; font-weight: bold; cursor: pointer;">Yes, Collected</button>
        </div>
    </div>
</div>

    <!-- include authentication helpers (firebase) -->
    <script type="module" src="../../js/auth.js"></script>
    <!-- dashboard navigation logic -->
    <script type="module" src="../../js/collection personnel/collection-dashboard.js"></script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZ0Bmue-DH2c2bjWsrnVJkRx9piYm8X6s&callback=initMap&loading=async" async defer></script>

</body>
</html>
