<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinSense - Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/history.css">
</head>
<body>

    <div class="mobile-container">
        
        <header class="top-nav">
            <h1 class="dashboard-title">Guide</h1>
            
            <div class="notification-icon-container">
                <button class="notification-btn" id="notificationBtn">
                    <svg class="notification-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

        </header>

        <main class="main-content">
            <!-- ADDED NOTIFICATION PANEL HERE -->
            <div id="notificationPanel" class="notification-panel">
                <div class="notification-panel-header">
                    <h3>Notifications</h3>
                    <button class="close-notification-btn" id="closeNotificationBtn">&times;</button>
                </div>
                <div id="notificationList" class="notification-list">
                    <p class="empty-notification-message">No new notifications</p>
                </div>
                <div class="notification-panel-footer">
                    <!-- Note: Your JS looks for 'clearAllBtn' but your screenshot HTML had 'clearNotifications'. 
                         I used 'clearAllBtn' here to match the JS you provided. -->
                    <button class="clear-all-btn" id="clearAllBtn">Clear All</button>
                </div>
            </div>
            <!-- END OF NOTIFICATION PANEL -->

            <h2 class="guide-headline">Waste Segregation Guide</h2>
            <p class="guide-subtitle">Follow these instructions to sort your trash properly. Click each button to know what to put in each waste bin.</p>
            
            <div class="activity-list">
                <button class="guide-btn" data-modal="bioModal">
                    <div class="guide-btn-content">
                        <h3>Biodegradable</h3>
                        <p>Organic materials that can be broken down by microorganisms into fine particles.</p>
                    </div>
                </button>

                <button class="guide-btn" data-modal="recyModal">
                    <div class="guide-btn-content">
                        <h3>Recyclable</h3>
                        <p>Waste materials that can still be processed into raw materials for new products.</p>
                    </div>
                </button>

                <button class="guide-btn" data-modal="residModal">
                    <div class="guide-btn-content">
                        <h3>Residual</h3>
                        <p>Non-hazardous materials that have no further use and cannot be composted.</p>
                    </div>
                </button>

                <button class="guide-btn" data-modal="hazModal">
                    <div class="guide-btn-content">
                        <h3>Hazardous</h3>
                        <p>Materials containing toxic substances requiring special handling and disposal.</p>
                    </div>
                </button>
            </div>
        </main>

        <footer class="bottom-nav">
            <div class="nav-icons-container">
                <a href="dashboard.html" class="nav-link">
                    <img src="../logo/Home.png" alt="Home" class="icon-30">
                </a>
                <a href="analytics.html" class="nav-link">
                    <img src="../logo/Bar chart-2.png" alt="Analytics" class="icon-30">
                </a>
                <a href="#" class="nav-link active">
                    <img src="../logo/Activity History.png" alt="Reports" class="icon-30">
                </a>
                <a href="menu.html" class="nav-link">
                    <img src="../logo/Menu.png" alt="Menu" class="icon-30">
                </a>
            </div>
        </footer>

        <div class="guide-modal-overlay" id="guideModalOverlay">
            <div class="guide-modal-box">
                <div class="modal-body-content">
                    <h2 id="modalTitle" class="modal-h2">What to put in:</h2>
                    <p id="modalDesc" class="modal-desc"></p>
                    <ol id="modalList" class="modal-ol"></ol>
                </div>
                <div class="modal-footer">
                    <button class="modal-okay-btn" id="modalCloseBtn">Okay</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/history.js"></script>
</body>
</html>
