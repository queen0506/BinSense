<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinSense - LGU Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/lgu admin/lgu-analytics.css">
    <link rel="stylesheet" href="../../css/lgu admin/lgu-notifications.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="mobile-container">
        <header class="top-nav">
            <h1 class="dashboard-title">Waste Analytics</h1>
        </header>

        <main class="main-content">
            <div class="chart-container-box">
                <h3 class="chart-label">Average Bin Fill Trend (%)</h3>
                <p id="wasteChartStatus" class="chart-status" role="status" hidden></p>
                <div class="canvas-wrapper">
                    <canvas id="wasteChart"></canvas>
                </div>
            </div>

                        <!-- BAGONG SECTION: Collection Records -->
            <section class="records-section">
                <div class="records-header">
                    <h3 class="section-label" style="margin-bottom: 0;">Recent Collection Records</h3>
                    
                    <!-- DATE FILTER -->
                    <select id="dateFilter" class="records-filter">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>

                <div class="records-table-container">
                    <table class="records-table">
                        <thead>
                            <tr>
                                <th>Bin / Barangay</th>
                                <th>Date & Time</th>
                                <th>Actual Collector</th>
                                <th>Registered To</th>
                            </tr>
                        </thead>
                        <tbody id="collectionRecordsBody">
                            <tr><td colspan="4" style="text-align: center; color: #888; padding: 20px;">Loading records...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- PAGINATION CONTROLS -->
                <div class="pagination-container">
                    <button id="prevPageBtn" class="page-btn" disabled>Previous</button>
                    <span id="pageInfo" class="page-info">Page 1 of 1</span>
                    <button id="nextPageBtn" class="page-btn" disabled>Next</button>
                </div>
            </section>

        </main>

        <footer class="bottom-nav">
            <div class="nav-icons-container">
                <a href="lgu-monitoring.html" class="nav-link"><img src="../../logo/Home.png" class="icon-30"></a>
                <a href="#" class="nav-link active"><img src="../../logo/Bar chart-2.png" class="icon-30"></a>
                <a href="lgu-collection.html" class="nav-link"><img src="../../logo/Activity History.png" class="icon-30"></a>
                <a href="lgu-menu.html" class="nav-link"><img src="../../logo/Menu.png" class="icon-30"></a>
            </div>
        </footer>
    </div>

    <script type="module" src="../../js/lgu admin/lgu-analytics.js"></script>
</body>
</html>
